description: 'Boston Heart Diagnostics is a specialty cardiovascular diagnostics laboratory,
  part of Eurofins Scientific, that has been improving patient outcomes since 2007 through a
  combination of integrated diagnostics, advanced lipid and metabolic testing, genetic risk
  evaluation, personalized reporting, and a scientifically designed nutrition and lifestyle
  program. It serves clinicians and patients through a provider portal and a patient portal
  (mybostonheart.com) rather than a public developer API; there is no published developer
  portal, OpenAPI, or programmatic surface at this time. This profile was surfaced as a
  portfolio company of bain-capital-ventures and added to the API Evangelist network for
  enrichment; the identity and security-posture fields below are captured from the provider''s
  public web presence.'
